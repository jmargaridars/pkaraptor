[project]
name = "pkaraptor"
version = "0.2.2"
description = "Interactive integration of protein pKa predictions and residue-level structural environments"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Joana Ribeiro da Silva" },
  { name = "Pedro Ferreira" },
  { name = "Pedro Alexandrino Fernandes" },
]
license = "BSD-3-Clause"
keywords = [
  "bioinformatics",
  "computational-biochemistry",
  "molecular-dynamics",
  "pka",
  "protein-protonation",
  "protein-structure",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
  "numpy",
  "pandas",
  "mdtraj",
  "plotly",
  "propka",
  "openmm",
  "pdbfixer",
]

[project.optional-dependencies]
dev = [
  "ruff",
  "black",
  "pytest",
]

[project.scripts]
pkaraptor = "pkaraptor.cli:main"
pkaraptor-analysis = "pkaraptor.analysis_cli:main"
pkaraptor-run = "pkaraptor.workflow:run_main"
pkaraptor-finalize = "pkaraptor.workflow:finalize_main"
pkaraptor-dashboard = "pkaraptor.dashboard_cli:main"
pkaraptor-apply-json = "pkaraptor.apply_json:main"
pkaraptor-protonate = "pkaraptor.protonate:main"

[project.urls]
Homepage = "https://github.com/jmargaridars/pkaraptor"
Source = "https://github.com/jmargaridars/pkaraptor"
Issues = "https://github.com/jmargaridars/pkaraptor/issues"
Changelog = "https://github.com/jmargaridars/pkaraptor/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
pythonpath = ["src"]
